<div class="panel health-hero">
  <div class="panel-title-row">
    <h3>{{ hero_title }}</h3>
    {% if hero_tag %}
      <div class="panel-actions">
        <span class="pill">{{ hero_tag }}</span>
      </div>
    {% endif %}
  </div>
  {% if hero_subtitle %}
    <div class="muted">{{ hero_subtitle }}</div>
  {% endif %}
  {% set primary_tab = active_health_primary or active_health_tab %}
  <div class="health-nav">
    <a class="btn ghost btn-sm {% if primary_tab == 'dashboard' %}is-active{% endif %}" href="/health" {% if primary_tab == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
    <a class="btn ghost btn-sm {% if primary_tab == 'training' %}is-active{% endif %}" href="/health/training" {% if primary_tab == 'training' %}aria-current="page"{% endif %}>Training Live</a>
    <a class="btn ghost btn-sm {% if primary_tab == 'exercise' %}is-active{% endif %}" href="/health/exercise" {% if primary_tab == 'exercise' %}aria-current="page"{% endif %}>Exercise Plan</a>
    <a class="btn ghost btn-sm {% if primary_tab == 'supplements' %}is-active{% endif %}" href="/health/supplements" {% if primary_tab == 'supplements' %}aria-current="page"{% endif %}>Supplements</a>
    <a class="btn ghost btn-sm {% if primary_tab == 'trackers' %}is-active{% endif %}" href="/health/trackers" {% if primary_tab == 'trackers' %}aria-current="page"{% endif %}>Trackers</a>
  </div>
</div>
